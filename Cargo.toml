[package]
name = "bytepet"
version = "2.1.0"
edition = "2021"
description = "A virtual pet that lives on your desktop"
rust-version = "1.80"

[lib]
name = "bytepet"
path = "src/lib.rs"

[[bin]]
name = "bytepet"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:winit", "dep:glutin", "dep:glutin-winit", "dep:glow", "dep:notify-rust", "dep:auto-launch",
           "dep:cpal", "dep:tray-icon", "dep:ksni", "dep:windows-sys", "dep:libc", "dep:libloading"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
socket2 = { version = "0.5", features = ["all"] }

winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
glow = { version = "0.16", optional = true }
notify-rust = { version = "4", optional = true }
auto-launch = { version = "0.6", optional = true }
cpal = { version = "0.15", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.21", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true, features = ["blocking"] }
libloading = { version = "0.8", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", optional = true, features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_Security"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
