# Bytepet characters. Every sprite is 16x16: '#' is a dark dot, anything else is empty.
#
# Each character needs six frames: idle1, idle2, happy, sad, eat, sleep.
# A frame is either a full drawing, or a patch of another frame:
#   happy = { base = "idle1", rows = { 9 = "..#...#..#...#..", 10 = "..#..#.##.#..#.." } }
# Patches may also set shift_x / shift_y to move the whole base drawing.
#
# stage: baby | child | teen | adult | senior
# path:  humor | gorgeous | passion  (teens and adults)
# grade: a (best care) .. d (worst), "secret", or "rare" (children use a / b)
#
# To mod Bytepet, copy this file into <save folder>/content/ and edit it there.

