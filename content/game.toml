# Game rules: timings, items, jobs and friendship. All times are in seconds of pet time
# (at 1x speed that is real time). Copy into <save folder>/content/ to mod.

[life]
egg = 60
baby = 3600          # how long each stage lasts
child = 86400
teen = 172800
senior_age_days = 8  # unmarried adults become seniors at this age
matchmaker_age_days = 5
start_gp = 100

[care]
call_timeout = 900         # an unanswered call becomes a care mistake after this long
recall_baby = 900          # an ignored need calls again after this long
recall = 3600
empty_to_sick = 14400      # empty hearts this long -> sick
sick_to_gone_baby = 10800  # untreated sickness this long -> the pet goes home
sick_to_gone = 43200
poop_to_sick_baby = 1800
poop_to_sick = 10800
poop_to_sick_full = 3600   # when four poops have piled up
overweight_margin = 25     # grams over the stage's base weight
overweight_to_sick = 7200
fake_call_min = 10800      # discipline: pretend calls
fake_call_max = 25200
show_off_min = 14400       # discipline: dances that deserve praise
show_off_max = 28800
show_off_window = 300
refuse_window = 300
refuse_chance = 0.18       # chance an untrained pet refuses a meal
mail_min = 10800
mail_max = 21600
mail_max_waiting = 5
school_expires = 43200
work_cooldown = 7200
legacy_skill_share = 0.1   # share of a parent's skills its egg inherits

# Per-stage values. hunger/happy: seconds to lose one heart. sleep = [bedtime, wake hour].
[stage.baby]
hunger = 240
happy = 300
poop = [720, 1080]
weight = 5

[stage.child]
hunger = 2400
happy = 2100
poop = [7200, 10800]
weight = 10
sleep = [20, 8]

[stage.teen]
hunger = 3000
happy = 2700
poop = [8400, 12000]
weight = 15
sleep = [21, 9]

[stage.adult]
hunger = 3600
happy = 3300
poop = [9000, 12600]
weight = 20
sleep = [22, 9]

[stage.senior]
hunger = 4200
happy = 3900
poop = [9000, 12600]
weight = 20
sleep = [21, 8]

[evolution]
secret_skill = 200         # secret adult: this much in the path's skill and no mistakes after the baby stage
best_mistakes = 2          # plus a training meter of at least best_discipline
best_discipline = 75
good_mistakes = 4
fair_mistakes = 8
baby_good_mistakes = 1     # child_a (good) vs child_b

